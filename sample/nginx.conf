server {
    listen 443 ssl;
    server_name payments.internal.example;

    ssl_certificate     /etc/ssl/certs/payments.pem;
    ssl_certificate_key /etc/ssl/private/payments.key;

    # Weak: legacy protocol versions enabled
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;

    # Weak: 3DES and CBC modes offered
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:DES-CBC3-SHA:AES128-SHA;

    ssl_prefer_server_ciphers on;
}
