[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptoagility"
version = "0.1.0"
description = "Cryptographic asset discovery and CBOM generation — find every cryptographic asset, classify its quantum exposure, and produce an audit-ready migration register"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [{ name = "Maobyte Innovations Ltd" }]
keywords = ["cryptography", "post-quantum", "CBOM", "CycloneDX", "security", "PQC", "compliance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Topic :: Security :: Cryptography",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://mainnoltd.com"
Source = "https://github.com/<your-account>/cryptoagility"
Issues = "https://github.com/<your-account>/cryptoagility/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]

[project.scripts]
cryptoagility = "cryptoagility:main"

[tool.setuptools]
py-modules = ["cryptoagility"]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = []
